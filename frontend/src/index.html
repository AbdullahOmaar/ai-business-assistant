<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script>
    try {
      if (localStorage.getItem('aba-language') === 'en') {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      }
    } catch {}
  </script>
  <title>AIBA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <meta name="description" content="">
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}
    .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px}
    .boot-card{width:min(100%,520px);min-height:180px;display:grid;place-items:center;background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:32px;box-shadow:0 20px 60px #17203312}
    .boot-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#a7f3d0;color:#064e3b;font-size:21px;font-weight:900}
  </style>
</head>
<body>
  <aba-root>
    <main class="boot-fallback" role="status" aria-live="polite">
      <section class="boot-card"><div class="boot-mark" aria-hidden="true">A</div></section>
    </main>
  </aba-root>
</body>
</html>
