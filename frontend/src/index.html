<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Business Assistant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A practical workspace for managing business operations.">
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
    .boot-screen{max-width:560px;margin:10vh auto;padding:24px}
    .boot-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#a7f3d0;color:#064e3b;font-weight:900;font-size:20px}
    .boot-screen h1{font-size:24px;margin:18px 0 8px}
    .boot-screen p{color:#64748b;line-height:1.6;font-size:14px}
    .boot-spinner{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
  </style>
</head>
<body>
  <aba-root>
    <main class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark">A</div>
      <h1>AI Business Assistant</h1>
      <p>The app is starting. If this message stays on screen, refresh the page. The app will show a diagnostic message if startup fails.</p>
      <div class="boot-spinner" aria-hidden="true"></div>
      <noscript><p>JavaScript is required to run this application. Enable JavaScript and reload.</p></noscript>
    </main>
  </aba-root>
</body>
</html>
