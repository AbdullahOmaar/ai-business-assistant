<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>مساعد الأعمال الذكي</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="مساحة عمل عملية لإدارة أعمالك ومتابعة العملاء والمنتجات والفواتير والمدفوعات.">
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}
    .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px}
    .boot-card{width:min(100%,520px);background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:32px;box-shadow:0 20px 60px #17203312}
    .boot-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#a7f3d0;color:#064e3b;font-size:21px;font-weight:900}
    .boot-card h1{font-size:24px;letter-spacing:-.6px;margin:20px 0 8px}.boot-card p{font-size:14px;line-height:1.65;color:#64748b}
    .boot-note{margin-top:20px;padding:12px 14px;border-radius:10px;background:#f1f5f9;font-size:12px!important}
  </style>
</head>
<body>
  <aba-root>
    <main class="boot-fallback" role="status" aria-live="polite">
      <section class="boot-card">
        <div class="boot-mark">A</div>
        <h1>AI Business Assistant</h1>
        <p>جارٍ تشغيل التطبيق. إذا استمرت هذه الرسالة، فقد تعذّر بدء التشغيل؛ أعد التحميل أو تحقق من حالة النشر.</p>
        <p class="boot-note">شاشة بدء التشغيل · لن تُحمّل بيانات النشاط قبل بدء التطبيق بأمان.</p>
      </section>
    </main>
  </aba-root>
</body>
</html>
