name: Frontend browser smoke

on:
  pull_request:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches: ["main", "feat/**", "automation-testing-e2e"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned Playwright runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
