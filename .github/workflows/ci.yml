name: Verify backend and frontend
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-accounting:
    name: backend-accounting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_business_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_business_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_business_assistant_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_business_assistant_test
      CI_ALLOW_DATABASE_SCHEMA_TESTS: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pip-audit
      - name: Wait for disposable PostgreSQL
        run: |
          python - <<'PY'
          import time
          import psycopg
          deadline = time.monotonic() + 90
          dsn = "postgresql://postgres:postgres@127.0.0.1:5432/ai_business_assistant_test"
          while True:
              try:
                  with psycopg.connect(dsn, connect_timeout=3):
                      print("Disposable PostgreSQL is accepting connections.")
                  break
              except psycopg.OperationalError:
                  if time.monotonic() >= deadline:
                      raise SystemExit("PostgreSQL did not become ready within 90 seconds.")
                  time.sleep(2)
          PY
      - name: Apply migrations and check schema drift
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check
      - name: Run backend regression suite
        working-directory: backend
        run: |
          mkdir -p test-results
          python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Validate project knowledge and regression tests
        run: |
          python scripts/validate_project_knowledge.py
          python -m unittest discover -s tests -p 'test_project_knowledge_validator.py' -v
      - name: Verify offline migration SQL generation
        working-directory: backend
        run: |
          python -m alembic upgrade head --sql > /tmp/alembic-upgrade.sql
          test -s /tmp/alembic-upgrade.sql
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-pytest-results
          path: backend/test-results/pytest.xml
          if-no-files-found: ignore

  frontend-unit-tests:
    name: frontend-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  frontend-production-build:
    name: frontend-production-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generate build metadata
        working-directory: frontend
        run: npm run prebuild
      - name: Compile production frontend
        working-directory: frontend
        run: npx ng build

  frontend-dependency-audit:
    name: frontend-dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-browser-smoke:
    name: frontend-browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Mark workspace safe for Git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install frontend dependencies and Playwright
        working-directory: frontend
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright --version
      - name: Run Chromium browser smoke
        working-directory: frontend
        run: npx playwright test
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-smoke-results
          path: frontend/test-results/
          if-no-files-found: ignore

  backend-container:
    name: backend-container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify backup and restore safety guards without database access
        run: |
          bash -n scripts/backup-restore-drill.sh
          bash -n scripts/backup-restore-drill.test.sh
          bash scripts/backup-restore-drill.test.sh
      - name: Build backend image
        run: docker build --pull --tag ai-business-assistant-backend:ci ./backend
      - name: Verify FastAPI application import in container
        run: docker run --rm --entrypoint python ai-business-assistant-backend:ci -c "import app.main; print('FastAPI import OK')"


  authenticated-api-smoke:
    name: authenticated-api-smoke
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/invoice-payment-currency-guard-20261109' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aiba_release_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aiba_release_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/aiba_release_smoke
      EXPECTED_API_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Wait for disposable PostgreSQL
        run: |
          for attempt in $(seq 1 45); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d aiba_release_smoke; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Disposable PostgreSQL did not become ready."
          exit 1
      - name: Apply candidate migrations to disposable PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run authenticated smoke against the exact candidate API
        working-directory: backend
        run: python ../scripts/release-smoke-authenticated-api.py

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-accounting, frontend-unit-tests, frontend-production-build, frontend-dependency-audit, frontend-browser-smoke, backend-container, authenticated-api-smoke]
    steps:
      - name: Require every substantive job to succeed
        env:
          BACKEND: ${{ needs.backend-accounting.result }}
          FRONTEND_TESTS: ${{ needs.frontend-unit-tests.result }}
          FRONTEND_BUILD: ${{ needs.frontend-production-build.result }}
          FRONTEND_AUDIT: ${{ needs.frontend-dependency-audit.result }}
          BROWSER_SMOKE: ${{ needs.frontend-browser-smoke.result }}
          BACKEND_CONTAINER: ${{ needs.backend-container.result }}
          API_SMOKE: ${{ needs.authenticated-api-smoke.result }}
          REQUIRE_API_SMOKE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/invoice-payment-currency-guard-20261109' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          for result in "$BACKEND" "$FRONTEND_TESTS" "$FRONTEND_BUILD" "$FRONTEND_AUDIT" "$BROWSER_SMOKE" "$BACKEND_CONTAINER"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required CI job did not succeed: $result"
              exit 1
            fi
          done
          if [ "$REQUIRE_API_SMOKE" = "true" ] && [ "$API_SMOKE" != "success" ]; then
            echo "::error::Authenticated API smoke is required for the invoice release candidate but did not succeed: $API_SMOKE"
            exit 1
          fi
          echo "All six standard jobs and any branch-scoped candidate smoke passed."
