name: Verify backend and frontend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Active candidate branch is validated by pull_request synchronize; avoid duplicate push + PR suites.
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      backend_tests: ${{ steps.plan.outputs.backend_tests }}
      backend_full: ${{ steps.plan.outputs.backend_full }}
      backend_container: ${{ steps.plan.outputs.backend_container }}
      backend_audit: ${{ steps.plan.outputs.backend_audit }}
      migrations: ${{ steps.plan.outputs.migrations }}
      frontend_tests: ${{ steps.plan.outputs.frontend_tests }}
      frontend_full: ${{ steps.plan.outputs.frontend_full }}
      frontend_specs: ${{ steps.plan.outputs.frontend_specs }}
      frontend_build: ${{ steps.plan.outputs.frontend_build }}
      frontend_audit: ${{ steps.plan.outputs.frontend_audit }}
      api_smoke: ${{ steps.plan.outputs.api_smoke }}
      docs_validation: ${{ steps.plan.outputs.docs_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Select safe validation scope
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path

          out = Path(os.environ["GITHUB_OUTPUT"])
          keys = {
              "backend_tests": "false", "backend_full": "false",
              "backend_container": "false", "backend_audit": "false",
              "migrations": "false", "frontend_tests": "false",
              "frontend_full": "false", "frontend_specs": "",
              "frontend_build": "false", "frontend_audit": "false",
              "api_smoke": "false", "docs_validation": "false",
          }

          def save():
              with out.open("a", encoding="utf-8") as f:
                  for key, value in keys.items():
                      if key == "frontend_specs":
                          f.write(f"{key}<<EOF\n{value}\nEOF\n")
                      else:
                          f.write(f"{key}={value}\n")

          def force_full():
              for key in ("backend_tests", "backend_full", "backend_container",
                          "backend_audit", "migrations", "frontend_tests",
                          "frontend_full", "frontend_build", "frontend_audit"):
                  keys[key] = "true"

          event = os.environ["EVENT_NAME"]
          head = os.environ["HEAD_SHA"]
          api_required = (
              event == "pull_request"
              and os.environ.get("PR_HEAD_REF") == "master/nov-2026-phase-1-runtime-qa"
              and os.environ.get("PR_HEAD_REPO") == os.environ.get("REPOSITORY")
          ) or (
              event == "workflow_dispatch"
              and os.environ.get("REF_NAME") == "refs/heads/master/nov-2026-phase-1-runtime-qa"
          )
          keys["api_smoke"] = "true" if api_required else "false"

          full_event = event in ("schedule", "workflow_dispatch")
          base = os.environ.get("PR_BASE_SHA", "") if event == "pull_request" else os.environ.get("PUSH_BEFORE", "")
          if full_event:
              force_full()
          elif not base or set(base) == {"0"}:
              force_full()
          else:
              try:
                  subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], check=True, capture_output=True)
                  subprocess.run(["git", "cat-file", "-e", f"{head}^{{commit}}"], check=True, capture_output=True)
                  result = subprocess.run(
                      ["git", "diff", "--name-status", "--find-renames", base, head],
                      check=True, capture_output=True, text=True,
                  )
                  paths = []
                  for line in result.stdout.splitlines():
                      fields = line.split("\t")
                      if len(fields) != 2 or fields[0] not in ("A", "M"):
                          raise RuntimeError(f"added/deleted/renamed/type-changed path requires full fallback: {line}")
                      paths.append(fields[1])
                  if any(not Path(p).exists() for p in paths):
                      raise RuntimeError("changed path is missing from the candidate checkout")
              except Exception as exc:
                  print(f"::warning::Unable to calculate a trustworthy changed-path set ({exc}); running full regression.")
                  force_full()
                  paths = []

              if paths:
                  if any(
                      p.startswith(("docs/", ".github/"))
                      or p in ("AGENTS.md", "TASKS.md", "README.md", "CONTRIBUTING.md", "SECURITY.md")
                      for p in paths
                  ):
                      keys["docs_validation"] = "true"

                  known_prefixes = ("backend/", "frontend/", "docs/", "scripts/", ".github/", "tests/")
                  known_root_files = {
                      "AGENTS.md", "TASKS.md", "README.md", "CONTRIBUTING.md",
                      ".gitlab-ci.yml", ".gitignore", ".gitattributes", ".editorconfig",
                      "LICENSE", "SECURITY.md", "CODE_OF_CONDUCT.md",
                  }
                  unknown = [
                      p for p in paths
                      if not p.startswith(known_prefixes)
                      and p not in known_root_files

                  ]
                  if unknown:
                      print(f"::warning::Unknown changed paths require full regression: {unknown}")
                      force_full()
                  ci_meta_paths = {
                      "tests/test_ci_validation_scope.py",
                      "tests/test_project_knowledge_validator.py",
                      "tests/test_github_actions_slack_failure.py",
                  }
                  if any(p in ci_meta_paths for p in paths):
                      # These tests validate CI/governance tooling, not application behavior.
                      # Run them in the lightweight project-knowledge job, not app regressions.
                      keys["docs_validation"] = "true"

                  broad = any(
                      p.startswith(".github/workflows/")
                      or p.startswith("scripts/")
                      or (p.startswith("tests/") and p not in ci_meta_paths)
                      or p in ("AGENTS.md", "TASKS.md", "pyproject.toml", "pytest.ini",
                               "requirements.txt", "package.json", "package-lock.json")
                      for p in paths
                  )
                  if broad:
                      force_full()

                  backend_paths = [p for p in paths if p.startswith("backend/")]
                  if backend_paths:
                      keys["backend_tests"] = "true"
                      backend_source = any(
                          p.startswith(("backend/app/", "backend/alembic/", "backend/migrations/"))
                          or p in ("backend/Dockerfile", "backend/requirements.txt")
                          for p in backend_paths
                      )
                      backend_test_paths = [p for p in backend_paths if p.startswith("backend/tests/") and p.endswith(".py")]
                      # These test modules also provide fixtures/helpers imported by other test files.
                      # A focused run of the helper module alone would miss dependent regressions.
                      shared_backend_test_modules = {
                          "backend/tests/test_api.py",
                          "backend/tests/test_t39_purchase_receiving_api.py",
                          "backend/tests/test_platform_admin_api.py",
                      }
                      if backend_source or not backend_test_paths:
                          keys["backend_full"] = "true"
                      elif any(
                          not Path(p).exists()
                          or not Path(p).name.startswith("test_")
                          or p in shared_backend_test_modules
                          for p in backend_test_paths
                      ):
                          # conftest.py, helpers, fixtures and non-test support modules
                          # can affect the entire suite; never pass them to pytest as tests.
                          keys["backend_full"] = "true"
                      if any("alembic" in p or "migration" in p or p.endswith("/models.py") for p in backend_paths):
                          keys["migrations"] = "true"
                      # These focused test modules connect directly to disposable PostgreSQL.
                      postgres_schema_tests = {
                          "test_t39_inventory_movements_api.py",
                          "test_t39_receipt_idempotency_postgres_schema.py",
                      }
                      if any(Path(p).name in postgres_schema_tests for p in backend_test_paths):
                          keys["migrations"] = "true"
                      if any(p.startswith("backend/app/") or p in ("backend/Dockerfile", "backend/requirements.txt") for p in backend_paths):
                          keys["backend_container"] = "true"
                      if "backend/requirements.txt" in backend_paths:
                          keys["backend_audit"] = "true"

                  frontend_paths = [p for p in paths if p.startswith("frontend/")]
                  if frontend_paths:
                      keys["frontend_tests"] = "true"
                      spec_paths = []
                      force_frontend = False
                      high_risk_frontend_tokens = (
                          "auth", "firebase", "tenant", "guard", "route", "api.service",
                          "runtime-config", "service-worker", "security", "permission",
                          "localization", "accounting", "invoice", "payment", "stock",
                          "inventory", "audit", "payroll",
                      )
                      for p in frontend_paths:
                          if p.endswith(".spec.ts"):
                              if any(token in p.lower() for token in high_risk_frontend_tokens):
                                  force_frontend = True
                              else:
                                  spec_paths.append(p)
                              continue
                          if p.startswith(("frontend/src/app/core/", "frontend/src/app/shared/")) or any(
                              token in p.lower() for token in high_risk_frontend_tokens
                          ):
                              force_frontend = True
                              continue
                          if p.startswith("frontend/src/app/") and p.endswith(".ts"):
                              stem = Path(p).name.removesuffix(".ts")
                              candidates = [Path(p).with_name(stem + ".spec.ts")]
                              if stem.endswith(".component"):
                                  candidates.append(Path(p).with_name(stem.removesuffix(".component") + ".spec.ts"))
                              if stem.endswith(("-module", "-workspace")):
                                  candidates.append(Path(p).with_name(stem + ".spec.ts"))
                              found = [str(c) for c in candidates if c.exists()]
                              if found:
                                  spec_paths.extend(found)
                              else:
                                  force_frontend = True
                          elif p.startswith("frontend/src/app/") or p.startswith("frontend/src/"):
                              force_frontend = True
                          elif p in ("frontend/package.json", "frontend/package-lock.json", "frontend/angular.json", "frontend/tsconfig.json"):
                              force_frontend = True
                          elif p.startswith("frontend/public/i18n/"):
                              # Locale data is shared across every workspace; retain full frontend regression.
                              force_frontend = True
                          else:
                              force_frontend = True

                      if force_frontend:
                          keys["frontend_full"] = "true"
                      else:
                          unique = sorted(set(spec_paths))
                          if not unique or any(not Path(p).exists() for p in unique):
                              keys["frontend_full"] = "true"
                          else:
                              keys["frontend_specs"] = " ".join(unique)
                      if any(
                          (
                              p.startswith(("frontend/src/", "frontend/public/"))
                              and not p.endswith(".spec.ts")
                          )
                          or p.startswith(("frontend/angular.json", "frontend/tsconfig"))
                          or p in ("frontend/package.json", "frontend/package-lock.json")
                          for p in frontend_paths
                      ):
                          keys["frontend_build"] = "true"
                      if any(p in ("frontend/package.json", "frontend/package-lock.json", "frontend/.npmrc") for p in frontend_paths):
                          keys["frontend_audit"] = "true"

          # Changes to workflow/governance or inability to compute a diff are broad;
          # dependency/config changes always retain their audit/build safety checks.
          save()
          print("Validation plan:")
          for key, value in keys.items():
              print(f"{key}={value}")
          PY

  project-knowledge:
    name: project-knowledge
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate project knowledge and CI selector regression tests
        run: |
          python scripts/validate_project_knowledge.py
          python -m unittest discover -s tests -p 'test_project_knowledge_validator.py' -v
          python -m unittest discover -s tests -p 'test_github_actions_slack_failure.py' -v
          python -m unittest discover -s tests -p 'test_ci_validation_scope.py' -v

  backend-accounting:
    name: backend-accounting
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_business_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_business_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_business_assistant_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_business_assistant_test
      CI_ALLOW_DATABASE_SCHEMA_TESTS: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Wait for disposable PostgreSQL
        run: |
          python - <<'PY'
          import time, psycopg
          deadline = time.monotonic() + 90
          dsn = "postgresql://postgres:postgres@127.0.0.1:5432/ai_business_assistant_test"
          while True:
              try:
                  with psycopg.connect(dsn, connect_timeout=3):
                      print("Disposable PostgreSQL is accepting connections.")
                  break
              except psycopg.OperationalError:
                  if time.monotonic() >= deadline:
                      raise SystemExit("PostgreSQL did not become ready within 90 seconds.")
                  time.sleep(2)
          PY
      - name: Apply migrations and check schema drift
        if: needs.detect-changes.outputs.migrations == 'true'
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check
      - name: Run full backend regression suite
        if: needs.detect-changes.outputs.backend_full == 'true'
        working-directory: backend
        run: |
          mkdir -p test-results
          python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Run changed backend test modules
        if: needs.detect-changes.outputs.backend_full != 'true'
        working-directory: backend
        env:
          CHANGED_TESTS: ${{ needs.detect-changes.outputs.backend_tests == 'true' && needs.detect-changes.outputs.backend_full != 'true' && 'targeted' || 'none' }}
        run: |
          mkdir -p test-results
          mapfile -t files < <(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.sha }}" -- 'backend/tests/*.py' | sed 's#^backend/##' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No safe backend test selection was available."
            exit 1
          fi
          python -m pytest -q "${files[@]}" --junitxml=test-results/pytest.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-pytest-results
          path: backend/test-results/pytest.xml
          if-no-files-found: ignore

  frontend-unit-tests:
    name: frontend-unit-tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generate test metadata
        working-directory: frontend
        run: npm run pretest
      - name: Run full frontend regression suite
        if: needs.detect-changes.outputs.frontend_full == 'true'
        working-directory: frontend
        run: npm test
      - name: Run impacted frontend spec files
        if: needs.detect-changes.outputs.frontend_full != 'true'
        working-directory: frontend
        env:
          FRONTEND_SPECS: ${{ needs.detect-changes.outputs.frontend_specs }}
        run: |
          if [ -z "$FRONTEND_SPECS" ]; then
            echo "::error::No safe frontend test selection was available."
            exit 1
          fi
          node --experimental-strip-types --test $FRONTEND_SPECS

  frontend-production-build:
    name: frontend-production-build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generate build metadata
        working-directory: frontend
        run: npm run prebuild
      - name: Compile production frontend
        working-directory: frontend
        run: npx ng build

  frontend-dependency-audit:
    name: frontend-dependency-audit
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-dependency-audit:
    name: backend-dependency-audit
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

  backend-container:
    name: backend-container
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify backup and restore safety guards without database access
        run: |
          bash -n scripts/backup-restore-drill.sh
          bash -n scripts/backup-restore-drill.test.sh
          bash scripts/backup-restore-drill.test.sh
      - name: Build backend image
        run: docker build --pull --tag ai-business-assistant-backend:ci ./backend
      - name: Verify FastAPI application import in container
        run: docker run --rm --entrypoint python ai-business-assistant-backend:ci -c "import app.main; print('FastAPI import OK')"

  authenticated-api-smoke:
    name: authenticated-api-smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.api_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aiba_release_smoke
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aiba_release_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/aiba_release_smoke
      EXPECTED_API_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Wait for disposable PostgreSQL
        run: |
          for attempt in $(seq 1 45); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d aiba_release_smoke; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Disposable PostgreSQL did not become ready."
          exit 1
      - name: Apply candidate migrations to disposable PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run authenticated smoke against the exact candidate API
        working-directory: backend
        run: python ../scripts/release-smoke-authenticated-api.py

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - backend-accounting
      - frontend-unit-tests
      - frontend-production-build
      - frontend-dependency-audit
      - backend-dependency-audit
      - backend-container
      - authenticated-api-smoke
      - project-knowledge
    steps:
      - name: Require every selected validation job to succeed
        env:
          DETECT: ${{ needs.detect-changes.result }}
          BACKEND: ${{ needs.backend-accounting.result }}
          BACKEND_REQUIRED: ${{ needs.detect-changes.outputs.backend_tests }}
          BACKEND_CONTAINER: ${{ needs.backend-container.result }}
          BACKEND_CONTAINER_REQUIRED: ${{ needs.detect-changes.outputs.backend_container }}
          BACKEND_AUDIT: ${{ needs.backend-dependency-audit.result }}
          BACKEND_AUDIT_REQUIRED: ${{ needs.detect-changes.outputs.backend_audit }}
          FRONTEND_TESTS: ${{ needs.frontend-unit-tests.result }}
          FRONTEND_TESTS_REQUIRED: ${{ needs.detect-changes.outputs.frontend_tests }}
          FRONTEND_BUILD: ${{ needs.frontend-production-build.result }}
          FRONTEND_BUILD_REQUIRED: ${{ needs.detect-changes.outputs.frontend_build }}
          FRONTEND_AUDIT: ${{ needs.frontend-dependency-audit.result }}
          FRONTEND_AUDIT_REQUIRED: ${{ needs.detect-changes.outputs.frontend_audit }}
          API_SMOKE: ${{ needs.authenticated-api-smoke.result }}
          API_SMOKE_REQUIRED: ${{ needs.detect-changes.outputs.api_smoke }}
          DOCS: ${{ needs.project-knowledge.result }}
          DOCS_REQUIRED: ${{ needs.detect-changes.outputs.docs_validation }}
        run: |
          set -euo pipefail
          test "$DETECT" = "success" || { echo "::error::Change detection did not succeed: $DETECT"; exit 1; }
          check_job() {
            name="$1"; result="$2"; required="$3"
            if [ "$required" = "true" ]; then
              [ "$result" = "success" ] || { echo "::error::$name was required but result was $result"; exit 1; }
            else
              [ "$result" = "skipped" ] || { echo "::error::$name was not selected but result was $result"; exit 1; }
            fi
          }
          check_job backend-accounting "$BACKEND" "$BACKEND_REQUIRED"
          check_job backend-container "$BACKEND_CONTAINER" "$BACKEND_CONTAINER_REQUIRED"
          check_job backend-dependency-audit "$BACKEND_AUDIT" "$BACKEND_AUDIT_REQUIRED"
          check_job frontend-unit-tests "$FRONTEND_TESTS" "$FRONTEND_TESTS_REQUIRED"
          check_job frontend-production-build "$FRONTEND_BUILD" "$FRONTEND_BUILD_REQUIRED"
          check_job frontend-dependency-audit "$FRONTEND_AUDIT" "$FRONTEND_AUDIT_REQUIRED"
          check_job authenticated-api-smoke "$API_SMOKE" "$API_SMOKE_REQUIRED"
          check_job project-knowledge "$DOCS" "$DOCS_REQUIRED"
          echo "All selected checks passed on the exact candidate SHA; unselected jobs are explicitly verified as skipped."
