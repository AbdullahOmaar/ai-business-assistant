name: Backend tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_business_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_business_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ai_business_assistant
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ai_business_assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations to a real PostgreSQL instance
        run: python -m alembic upgrade head
      - name: Verify migration head
        run: python -m alembic current
      - name: Check ORM metadata has no ungenerated migration drift
        run: python -m alembic check
      - name: Run tests
        run: python -m pytest -q
      - name: Render migration SQL offline as a second check
        run: python -m alembic upgrade head --sql
