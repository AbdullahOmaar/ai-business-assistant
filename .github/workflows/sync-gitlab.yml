name: Sync GitHub refs to GitLab

# Dispatch-only: the workflow definition must be selected from protected main.
# It transports exact branch refs only. GitLab remains the sole CI provider.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact GitHub branch ref to mirror (refs/heads/<branch>)"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character GitHub commit SHA for that branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitlab-sync-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Push exact GitHub branch to GitLab
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gitlab-sync
    steps:
      - name: Validate trusted dispatcher and exact source ref
        id: validate
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Dispatch must use the protected main workflow definition." >&2
            exit 1
          }
          [[ "$SOURCE_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ ]] || {
            echo "Only refs/heads/* refs are accepted." >&2
            exit 1
          }
          git check-ref-format "$SOURCE_REF"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_sha must be a full lowercase 40-character SHA." >&2
            exit 1
          }
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify exact GitHub commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add github "https://github.com/$GITHUB_REPOSITORY.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags github "$SOURCE_REF"
          ACTUAL_SHA="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "Source ref moved: expected $EXPECTED_SHA, fetched $ACTUAL_SHA." >&2
            exit 1
          }
          git checkout --detach "$ACTUAL_SHA"
          echo "Verified GitHub source commit $ACTUAL_SHA."

      - name: Push exact commit to GitLab without force or pruning
        shell: bash
        env:
          GITLAB_SYNC_USERNAME: ${{ secrets.GITLAB_SYNC_USERNAME }}
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
          SOURCE_REF: ${{ steps.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_SYNC_USERNAME"
          test -n "$GITLAB_SYNC_TOKEN"
          askpass="$RUNNER_TEMP/gitlab-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITLAB_SYNC_USERNAME" ;;
            *Password*) printf '%s\n' "$GITLAB_SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          cd source
          git push --porcelain \
            "https://gitlab.com/abdullahomarrefaat/ai-business-assistant.git" \
            "$EXPECTED_SHA:$SOURCE_REF"
          echo "Synced $SOURCE_REF at $EXPECTED_SHA to GitLab without force."
