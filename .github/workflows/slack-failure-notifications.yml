name: Slack failure notifications

on:
  workflow_run:
    workflows: ["Verify backend and frontend"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow uses only trusted default-branch code. It never checks out
      # or executes the commit that failed CI, including pull-request code.
      - name: Check out trusted notifier implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send redacted failure summary to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          GH_EVENT_NAME: ${{ github.event.workflow_run.event }}
          GH_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0CFWGM87HC
        run: python scripts/ci/github_actions_slack_failure.py
