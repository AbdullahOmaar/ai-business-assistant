name: Deploy Angular frontend to Firebase Hosting

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Configure public Firebase web app settings
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          node -e 'const fs=require("fs"); const p="frontend/public/runtime-config.json"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.firebase={...c.firebase,apiKey:process.env.FIREBASE_WEB_API_KEY || "",authDomain:"ai-business-assistant-97f37.firebaseapp.com",projectId:"ai-business-assistant-97f37",appId:"1:803541434464:web:57242ff4d0ae409047c305"}; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'
          if [ -z "$FIREBASE_WEB_API_KEY" ]; then echo "Missing FIREBASE_WEB_API_KEY secret"; exit 1; fi

      - name: Build Angular production bundle
        working-directory: frontend
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ai-business-assistant-97f37
          channelId: live
