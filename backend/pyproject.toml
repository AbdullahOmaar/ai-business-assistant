[project]
name = "ai-business-assistant-backend"
version = "1.3.1"
description = "FastAPI backend for AI Business Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "firebase-admin>=6.5,<8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
