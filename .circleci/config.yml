# CircleCI is the approved CI provider for this private repository.
# Runs tests, audits, and disposable validation only; it never deploys or touches production.
version: 2.1

orbs:
  slack: circleci/slack@6.1.3

commands:
  initialize-failure-details:
    steps:
      - run:
          name: Initialize Slack failure fallback
          command: |
            cat >> "$BASH_ENV" <<'ABA_FAILURE_DEFAULTS'
            export ABA_FAILURE_STEP_BLOCK_JSON='"*Failed step:*\nNot captured"'
            export ABA_FAILURE_EXCERPT_BLOCK_JSON='"*Redacted error excerpt:*\nThe job failed before diagnostic collection could run."'
            ABA_FAILURE_DEFAULTS
  notify-on-failure:
    steps:
      - run:
          name: Collect redacted CircleCI failure details
          when: on_fail
          command: bash scripts/ci/prepare_slack_failure.sh || true
      - slack/notify:
          channel: C0CFWGM87HC
          event: fail
          custom: |
            {
              "text": "CircleCI job failed: ${CIRCLE_JOB} on ${CIRCLE_BRANCH}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "CI Job Failed :red_circle:",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project:*\n${CIRCLE_PROJECT_REPONAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow ID:*\n${CIRCLE_WORKFLOW_ID}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job:*\n${CIRCLE_JOB}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${CIRCLE_BRANCH}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n`${CIRCLE_SHA1}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${ABA_FAILURE_STEP_BLOCK_JSON}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${ABA_FAILURE_EXCERPT_BLOCK_JSON}
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open CircleCI job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
          ignore_errors: true

jobs:
  backend-accounting:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16
        environment:
          POSTGRES_DB: ai_business_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: medium
    working_directory: ~/project
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_business_assistant_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_business_assistant_test
      CI_ALLOW_DATABASE_SCHEMA_TESTS: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Install backend test and audit dependencies
          command: |
            set -euo pipefail
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt pip-audit
      - run:
          name: Test Slack failure diagnostics and redaction
          command: |
            set -euo pipefail
            bash -n scripts/ci/prepare_slack_failure.sh
            bash -n tests/test_slack_failure_details.sh
            bash tests/test_slack_failure_details.sh
      - run:
          name: Wait for isolated PostgreSQL service
          command: |
            cd backend
            python -c '
            import time
            import psycopg

            deadline = time.monotonic() + 90
            dsn = "postgresql://postgres@localhost:5432/ai_business_assistant_test"
            while True:
                try:
                    with psycopg.connect(dsn, connect_timeout=3):
                        print("Disposable PostgreSQL is accepting connections.")
                    break
                except psycopg.OperationalError:
                    if time.monotonic() >= deadline:
                        raise SystemExit("PostgreSQL did not become ready within 90 seconds.")
                    time.sleep(2)
            '
      - run:
          name: Apply migrations and check schema drift against PostgreSQL
          command: |
            set -euo pipefail
            cd backend
            mkdir -p test-results
            python -m alembic upgrade head
            python -m alembic current
            python -m alembic check
      - run:
          name: Run full backend and financial regression suite
          command: |
            set -euo pipefail
            cd backend
            python -m pytest -q --junitxml=test-results/pytest.xml
      - run:
          name: Validate shared project knowledge package and 17 regression tests
          command: |
            set -euo pipefail
            python scripts/validate_project_knowledge.py
            python -m unittest discover -s tests -p 'test_project_knowledge_validator.py' -v
      - run:
          name: Verify offline migration SQL generation
          command: |
            set -euo pipefail
            cd backend
            python -m alembic upgrade head --sql > /tmp/alembic-upgrade.sql
            test -s /tmp/alembic-upgrade.sql
      - run:
          name: Audit Python dependencies
          command: |
            set -o pipefail
            pip-audit -r backend/requirements.txt 2>&1 | tee /tmp/pip-audit.txt
      - store_test_results:
          path: backend/test-results
      - store_artifacts:
          path: backend/test-results/pytest.xml
          destination: backend-pytest.xml
      - store_artifacts:
          path: /tmp/pip-audit.txt
          destination: pip-audit.txt
      - store_artifacts:
          path: /tmp/alembic-upgrade.sql
          destination: alembic-upgrade.sql

      - notify-on-failure
  frontend-unit-tests:
    docker:
      - image: cimg/node:22.12
    resource_class: medium
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Verify Node runtime and install frontend dependencies
          command: |
            set -euo pipefail
            node --version
            npm --version
            cd frontend
            npm ci --no-audit --no-fund
      - run:
          name: Run frontend unit and source regression tests
          command: |
            set -euo pipefail
            cd frontend
            npm test

      - notify-on-failure
  frontend-production-build:
    docker:
      - image: cimg/node:22.12
    resource_class: medium
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Verify Node runtime and install frontend dependencies
          command: |
            set -euo pipefail
            node --version
            npm --version
            cd frontend
            npm ci --no-audit --no-fund
      - run:
          name: Generate build metadata
          command: |
            set -euo pipefail
            cd frontend
            npm run prebuild
      - run:
          name: Compile optimized production frontend
          command: |
            set -euo pipefail
            cd frontend
            npx ng build

      - notify-on-failure
  frontend-dependency-audit:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Verify Node runtime and install frontend dependencies
          command: |
            set -euo pipefail
            node --version
            npm --version
            cd frontend
            npm ci --no-audit --no-fund
      - run:
          name: Audit npm dependencies
          command: |
            set -o pipefail
            cd frontend
            npm audit --audit-level=high 2>&1 | tee /tmp/npm-audit.txt
      - store_artifacts:
          path: /tmp/npm-audit.txt
          destination: npm-audit.txt

      - notify-on-failure
  backend-container:
    docker:
      - image: cimg/base:stable
    resource_class: small
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Verify backup/restore safety guards without database access
          command: |
            set -euo pipefail
            bash -n scripts/backup-restore-drill.sh
            bash -n scripts/backup-restore-drill.test.sh
            bash scripts/backup-restore-drill.test.sh
      - setup_remote_docker
      - run:
          name: Build and import-check the backend container
          command: |
            set -euo pipefail
            docker build --pull --tag ai-business-assistant-backend:ci ./backend
            docker run --rm --entrypoint python ai-business-assistant-backend:ci -c "import app.main; print('FastAPI import OK')"

      - notify-on-failure
  dependency-audit-python:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Audit Python dependencies
          command: |
            python -m pip install --upgrade pip pip-audit
            pip-audit -r backend/requirements.txt
      - notify-on-failure

  dependency-audit-frontend:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Audit frontend dependencies
          command: |
            set -euo pipefail
            cd frontend
            npm ci --no-audit --no-fund
            npm audit --audit-level=high
      - notify-on-failure

  frontend-browser-smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.55.0-noble
    resource_class: medium
    working_directory: ~/project
    steps:
      - initialize-failure-details
      - checkout
      - run:
          name: Install frontend dependencies and run Chromium E2E
          command: |
            set -euo pipefail
            cd frontend
            npm ci --no-audit --no-fund
            npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
            npx playwright --version
            npx playwright test
      - store_test_results:
          path: frontend/test-results
      - store_artifacts:
          path: frontend/test-results/e2e-junit.xml
          destination: frontend-e2e-junit.xml

      - notify-on-failure
  all-checks-passed:
    type: no-op

workflows:
  verify-main:
    jobs:
      - backend-accounting:
          context: slack-secrets
          filters:
            branches:
              only: main
      - frontend-unit-tests:
          context: slack-secrets
          filters:
            branches:
              only: main
      - frontend-production-build:
          context: slack-secrets
          filters:
            branches:
              only: main
      - frontend-dependency-audit:
          context: slack-secrets
          filters:
            branches:
              only: main
      - frontend-browser-smoke:
          context: slack-secrets
          filters:
            branches:
              only: main
      - backend-container:
          context: slack-secrets
          filters:
            branches:
              only: main
      - all-checks-passed:
          requires:
            - backend-accounting
            - frontend-unit-tests
            - frontend-production-build
            - frontend-dependency-audit
            - frontend-browser-smoke
            - backend-container
          filters:
            branches:
              only: main

  verify-non-main:
    jobs:
      - backend-accounting:
          context: slack-secrets
          filters:
            branches:
              ignore: main
      - frontend-unit-tests:
          context: slack-secrets
          filters:
            branches:
              ignore: main
      - frontend-production-build:
          context: slack-secrets
          filters:
            branches:
              ignore: main
      - frontend-dependency-audit:
          context: slack-secrets
          filters:
            branches:
              ignore: main
      - frontend-browser-smoke:
          context: slack-secrets
          filters:
            branches:
              ignore: main
      - backend-container:
          context: slack-secrets
          filters:
            branches:
              ignore: main
      - all-checks-passed:
          requires:
            - backend-accounting
            - frontend-unit-tests
            - frontend-production-build
            - frontend-dependency-audit
            - frontend-browser-smoke
            - backend-container
          filters:
            branches:
              ignore: main

  scheduled-dependency-audit:
    triggers:
      - schedule:
          cron: "23 8 * * 1"
          filters:
            branches:
              only:
                - main
    jobs:
      - dependency-audit-python:
          context: slack-secrets
      - dependency-audit-frontend:
          context: slack-secrets
