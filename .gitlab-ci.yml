# GitLab Free automatic validation only.
# GitHub remains canonical. GitHub webhook payloads select the exact source SHA;
# every job fetches and validates that immutable GitHub commit. No deployment or
# production data access is performed.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

stages:
  - prepare
  - test
  - build
  - security
  - report

variables:
  GIT_STRATEGY: "none"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

.status-artifacts:
  after_script:
    - mkdir -p "$CI_PROJECT_DIR/job-status"
    - printf '%s\n' "$CI_JOB_STATUS" > "$CI_PROJECT_DIR/job-status/$CI_JOB_NAME.txt"
  artifacts:
    when: always
    paths:
      - job-status/
    expire_in: 7 days

resolve-event:
  extends: .status-artifacts
  stage: prepare
  image: python:3.12-alpine
  script:
    - |
      set -eu
      python - <<'PY'
      import json
      import os
      import re

      payload_path = os.environ.get("TRIGGER_PAYLOAD", "")
      if not payload_path or not os.path.isfile(payload_path):
          raise SystemExit("GitLab TRIGGER_PAYLOAD is missing; configure this pipeline with a GitHub webhook delivery.")

      with open(payload_path, encoding="utf-8") as payload_file:
          payload = json.load(payload_file)

      repository = (payload.get("repository") or {}).get("full_name", "")
      if repository.casefold() != "abdullahomaar/ai-business-assistant":
          raise SystemExit("Webhook repository does not match the canonical GitHub repository.")

      if isinstance(payload.get("pull_request"), dict):
          event = "pull_request"
          pull_request = payload["pull_request"]
          sha = ((pull_request.get("head") or {}).get("sha")) or ""
          pr_number = str(payload.get("number") or "")
          base_repository = ((pull_request.get("base") or {}).get("repo") or {}).get("full_name", "")
          if base_repository.casefold() != "abdullahomaar/ai-business-assistant":
              raise SystemExit("Pull request base repository is not the canonical GitHub repository.")
          if not pr_number.isdigit() or int(pr_number) < 1:
              raise SystemExit("Pull request webhook did not contain a valid PR number.")
      else:
          event = "push"
          sha = payload.get("after", "")
          pr_number = ""
          ref = payload.get("ref", "")
          if not ref.startswith("refs/heads/"):
              raise SystemExit("Only GitHub branch push events are supported; tag/deletion events are ignored.")
          if payload.get("deleted") is True:
              raise SystemExit("Deleted-branch webhook events do not run validation.")

      if not re.fullmatch(r"[0-9a-f]{40}", sha):
          raise SystemExit("Webhook did not contain a valid 40-character GitHub commit SHA.")

      with open("event.env", "w", encoding="utf-8") as env_file:
          env_file.write(f"SOURCE_SHA={sha}\n")
          env_file.write(f"GITHUB_EVENT={event}\n")
          env_file.write(f"GITHUB_REPOSITORY={repository}\n")
          env_file.write(f"GITHUB_PR_NUMBER={pr_number}\n")

      print(f"Validated GitHub {event} webhook for canonical SHA: {sha}")
      PY
  artifacts:
    when: always
    reports:
      dotenv: event.env
    paths:
      - job-status/
    expire_in: 7 days
status-pending:
  extends: .status-artifacts
  stage: prepare
  image: curlimages/curl:8.11.1
  needs:
    - job: resolve-event
      artifacts: true
  environment:
    name: status-report
  script:
    - |
      set -eu
      : "$SOURCE_SHA"
      : "$GITHUB_STATUS_TOKEN"
      case "$SOURCE_SHA" in
        *[!0-9a-f]*|'') echo "SOURCE_SHA must be 40 lowercase hexadecimal characters." >&2; exit 1 ;;
      esac
      test "$(printf %s "$SOURCE_SHA" | wc -c)" -eq 40
      payload="$(printf '{"state":"pending","context":"gitlab/automatic","description":"GitLab automatic exact-SHA validation in progress","target_url":"%s"}' "$CI_PIPELINE_URL")"
      curl --fail --silent --show-error \
        --request POST \
        --header "Accept: application/vnd.github+json" \
        --header "Authorization: Bearer $GITHUB_STATUS_TOKEN" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --header "Content-Type: application/json" \
        --data "$payload" \
        "https://api.github.com/repos/AbdullahOmaar/ai-business-assistant/statuses/$SOURCE_SHA"

prepare-source:
  extends: .status-artifacts
  stage: prepare
  image: alpine:3.21
  needs:
    - job: resolve-event
      artifacts: true
    - job: status-pending
      artifacts: true
  environment:
    name: source-fetch
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - |
      set -eu
      : "$SOURCE_SHA"
      : "$GITHUB_READ_TOKEN"
      {
        printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
        printf 'GITHUB_EVENT=%s\n' "${GITHUB_EVENT:-unknown}"
        printf 'GITHUB_REPOSITORY=%s\n' "${GITHUB_REPOSITORY:-}"
        printf 'GITHUB_PR_NUMBER=%s\n' "${GITHUB_PR_NUMBER:-}"
      } > event.env
      case "$SOURCE_SHA" in
        *[!0-9a-f]*|'') echo "SOURCE_SHA must be 40 lowercase hexadecimal characters." >&2; exit 1 ;;
      esac
      test "$(printf %s "$SOURCE_SHA" | wc -c)" -eq 40
      mkdir -p source
      askpass="$(mktemp)"
      trap 'rm -f "$askpass"' EXIT
      cat > "$askpass" <<'ASKPASS'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' "x-access-token" ;;
        *) printf '%s\n' "$GITHUB_READ_TOKEN" ;;
      esac
      ASKPASS
      chmod 700 "$askpass"
      export GIT_ASKPASS="$askpass"
      export GIT_ASKPASS_REQUIRE=force
      export GIT_TERMINAL_PROMPT=0
      git -C source init
      git -C source remote add origin https://github.com/AbdullahOmaar/ai-business-assistant.git
      if [ "$GITHUB_EVENT" = "pull_request" ]; then
        : "${GITHUB_PR_NUMBER:?Pull request number is required for pull-request events}"
        git -C source fetch --no-tags --depth=1 origin "refs/pull/$GITHUB_PR_NUMBER/head"
      else
        git -C source fetch --no-tags --depth=1 origin "$SOURCE_SHA"
      fi
      git -C source checkout --detach FETCH_HEAD
      actual_sha="$(git -C source rev-parse HEAD)"
      test "$actual_sha" = "$SOURCE_SHA" || {
        echo "Fetched source SHA does not match SOURCE_SHA." >&2
        exit 1
      }
      git -C source remote remove origin
      echo "Verified GitHub source SHA: $actual_sha"
  artifacts:
    when: always
    reports:
      dotenv: event.env
    paths:
      - source/
      - job-status/
    expire_in: 7 days

backend-tests:
  extends: .status-artifacts
  stage: test
  image: python:3.12-slim
  needs:
    - job: prepare-source
      artifacts: true
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: ai_business_assistant_test
    POSTGRES_USER: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/ai_business_assistant_test
    TEST_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/ai_business_assistant_test
    CI_ALLOW_DATABASE_SCHEMA_TESTS: "true"
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r source/backend/requirements.txt
    - |
      python - <<'PY'
      import time
      import psycopg

      deadline = time.monotonic() + 90
      while True:
          try:
              with psycopg.connect(
                  "postgresql://postgres@postgres:5432/ai_business_assistant_test",
                  connect_timeout=3,
              ):
                  print("Disposable PostgreSQL is ready.")
              break
          except psycopg.OperationalError:
              if time.monotonic() >= deadline:
                  raise SystemExit("PostgreSQL did not become ready within 90 seconds.")
              time.sleep(2)
      PY
  script:
    - cd source
    - mkdir -p backend/test-results
    - cd backend
    - python -m alembic upgrade head
    - python -m alembic current
    - python -m alembic check
    - python -m pytest -q --junitxml=test-results/pytest.xml
    - python -m alembic upgrade head --sql > test-results/alembic-upgrade.sql
    - test -s test-results/alembic-upgrade.sql
    - cd ..
    - python scripts/validate_project_knowledge.py
    - python -m unittest discover -s tests -p 'test_project_knowledge_validator.py' -v
  artifacts:
    when: always
    reports:
      junit: source/backend/test-results/pytest.xml
    paths:
      - job-status/
      - source/backend/test-results/
    expire_in: 7 days

frontend-tests:
  extends: .status-artifacts
  stage: test
  image: node:22.12-bookworm
  needs:
    - job: prepare-source
      artifacts: true
  script:
    - cd source/frontend
    - npm ci --no-audit --no-fund
    - npm test

backend-container-smoke:
  extends: .status-artifacts
  stage: build
  image: docker:27.5.1-cli
  needs:
    - job: prepare-source
      artifacts: true
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: "overlay2"
  before_script:
    - |
      attempt=0
      until docker info >/dev/null 2>&1; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 30 ]; then
          echo "Docker daemon did not become ready within 60 seconds." >&2
          exit 1
        fi
        sleep 2
      done
  script:
    - docker build --pull --file source/backend/Dockerfile --tag "ai-business-assistant-backend-ci:$SOURCE_SHA" source/backend
    - docker run --rm --entrypoint python "ai-business-assistant-backend-ci:$SOURCE_SHA" -c "import app.main; print('FastAPI import OK')"

frontend-build:
  extends: .status-artifacts
  stage: build
  image: node:22.12-bookworm
  needs:
    - job: prepare-source
      artifacts: true
  script:
    - cd source/frontend
    - npm ci --no-audit --no-fund
    - npm run prebuild
    - npx ng build

python-dependency-audit:
  extends: .status-artifacts
  stage: security
  image: python:3.12-slim
  needs:
    - job: prepare-source
      artifacts: true
  script:
    - python -m pip install --upgrade pip pip-audit
    - pip-audit -r source/backend/requirements.txt

frontend-dependency-audit:
  extends: .status-artifacts
  stage: security
  image: node:22.12-bookworm
  needs:
    - job: prepare-source
      artifacts: true
  script:
    - cd source/frontend
    - npm ci --no-audit --no-fund
    - npm audit --audit-level=high

backup-restore-safety:
  extends: .status-artifacts
  stage: test
  image: alpine:3.21
  needs:
    - job: prepare-source
      artifacts: true
  before_script:
    - apk add --no-cache bash coreutils grep
  script:
    - bash -n source/scripts/backup-restore-drill.sh
    - bash -n source/scripts/backup-restore-drill.test.sh
    - bash source/scripts/backup-restore-drill.test.sh

frontend-browser-e2e:
  extends: .status-artifacts
  stage: test
  image: mcr.microsoft.com/playwright:v1.55.0-noble
  needs:
    - job: prepare-source
      artifacts: true
  script:
    - cd source/frontend
    - npm ci --no-audit --no-fund
    - npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
    - npx playwright --version
    - npx playwright test
  artifacts:
    when: always
    paths:
      - job-status/
      - source/frontend/test-results/
      - source/frontend/playwright-report/
    expire_in: 7 days

report-final:
  extends: .status-artifacts
  stage: report
  image: curlimages/curl:8.11.1
  environment:
    name: status-report
  when: always
  needs:
    - job: resolve-event
      artifacts: true
    - job: status-pending
      artifacts: true
    - job: prepare-source
      artifacts: true
    - job: backend-tests
      artifacts: true
    - job: frontend-tests
      artifacts: true
    - job: backend-container-smoke
      artifacts: true
    - job: frontend-build
      artifacts: true
    - job: python-dependency-audit
      artifacts: true
    - job: frontend-dependency-audit
      artifacts: true
    - job: backup-restore-safety
      artifacts: true
    - job: frontend-browser-e2e
      artifacts: true
  script:
    - |
      set -eu
      : "$SOURCE_SHA"
      : "$GITHUB_STATUS_TOKEN"
      failed=0
      for job in resolve-event status-pending prepare-source backend-tests frontend-tests backend-container-smoke frontend-build python-dependency-audit frontend-dependency-audit backup-restore-safety frontend-browser-e2e; do
        status_file="job-status/$job.txt"
        job_status="$(cat "$status_file" 2>/dev/null || printf 'missing')"
        if [ "$job_status" != "success" ]; then
          echo "$job: $job_status"
          failed=1
        else
          echo "$job: success"
        fi
      done
      if [ "$failed" -eq 0 ]; then
        state="success"
        description="All GitLab automatic exact-SHA validation jobs passed"
      else
        state="failure"
        description="One or more GitLab automatic exact-SHA validation jobs failed or did not run"
      fi
      payload="$(printf '{"state":"%s","context":"gitlab/automatic","description":"%s","target_url":"%s"}' "$state" "$description" "$CI_PIPELINE_URL")"
      curl --fail --silent --show-error \
        --request POST \
        --header "Accept: application/vnd.github+json" \
        --header "Authorization: Bearer $GITHUB_STATUS_TOKEN" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        --header "Content-Type: application/json" \
        --data "$payload" \
        "https://api.github.com/repos/AbdullahOmaar/ai-business-assistant/statuses/$SOURCE_SHA"
      test "$failed" -eq 0
