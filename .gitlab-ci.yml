# GitLab CI validation only; no production deployment or production data writes.
stages: [test, build, security]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - .npm/

backend-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16
  variables:
    POSTGRES_DB: ai_business_assistant_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_business_assistant_test
    TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_business_assistant_test
    CI_ALLOW_DATABASE_SCHEMA_TESTS: "true"
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r backend/requirements.txt
    - |
      python - <<'PY'
      import time, psycopg
      deadline = time.monotonic() + 90
      while True:
          try:
              with psycopg.connect("postgresql://postgres:postgres@postgres:5432/ai_business_assistant_test", connect_timeout=3):
                  print("Disposable PostgreSQL is ready.")
              break
          except psycopg.OperationalError:
              if time.monotonic() >= deadline:
                  raise SystemExit("PostgreSQL did not become ready within 90 seconds.")
              time.sleep(2)
      PY
  script:
    - cd backend
    - mkdir -p test-results
    - python -m alembic upgrade head
    - python -m alembic current
    - python -m alembic check
    - python -m pytest -q --junitxml=test-results/pytest.xml
    - python -m alembic upgrade head --sql > test-results/alembic-upgrade.sql
    - test -s test-results/alembic-upgrade.sql
  artifacts:
    when: always
    reports:
      junit: backend/test-results/pytest.xml
    paths:
      - backend/test-results/
    expire_in: 7 days

frontend-tests:
  stage: test
  image: node:22.12-bookworm
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm test

frontend-build:
  stage: build
  image: node:22.12-bookworm
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run prebuild
    - npx ng build

python-dependency-audit:
  stage: security
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip pip-audit
    - pip-audit -r backend/requirements.txt

frontend-dependency-audit:
  stage: security
  image: node:22.12-bookworm
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm audit --audit-level=high

backup-restore-safety:
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash coreutils grep
  script:
    - bash -n scripts/backup-restore-drill.sh
    - bash -n scripts/backup-restore-drill.test.sh
    - bash scripts/backup-restore-drill.test.sh

frontend-browser-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.55.0-noble
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
    - npx playwright --version
    - npx playwright test
  artifacts:
    when: always
    paths:
      - frontend/test-results/
      - frontend/playwright-report/
    expire_in: 7 days
